  <h1>Addition in C++</h1>

  <p>This project demonstrates addition of two numbers using C++.</p>

  <h3>C++ Code:</h3>
  <pre>
#include &lt;iostream&gt;
using namespace std;

int main() {
    int a = 10, b = 20;
    cout << "Sum = " << a + b;
    return 0;
}
  </pre>

  <p><b>Output:</b> Sum = 30</p>
